<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica - Skelson</title>
    <!-- Fonte moderna do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* Container Principal */
        .calculator {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Topo e Assinatura */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }

        .brand-signature {
            font-family: 'Caveat', cursive;
            font-size: 2rem;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            letter-spacing: 1px;
        }

        .mode-indicator {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Visor Display */
        .display-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 15px 20px;
            text-align: right;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 90px;
            word-wrap: break-word;
            word-break: break-all;
        }

        .previous-operand {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            min-height: 20px;
        }

        .current-operand {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 600;
            margin-top: 5px;
        }

        /* Grade de Botões */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        button {
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.07);
            color: #e0e0e0;
            font-size: 0.95rem;
            border-radius: 12px;
            padding: 14px 0;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.15);
        }

        /* Estilos Específicos para Botões */
        .btn-sci {
            color: #00d2ff;
            background: rgba(0, 210, 255, 0.08);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-op {
            color: #ff9f43;
            background: rgba(255, 159, 67, 0.1);
            font-weight: 600;
        }

        .btn-clear {
            color: #ff5252;
            background: rgba(255, 82, 82, 0.15);
            font-weight: 600;
        }

        .btn-equal {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff;
            font-weight: 600;
            grid-column: span 2;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }

        .btn-equal:active {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
        }

        /* Ajustes de Responsividade para Telas Menores */
        @media (max-width: 360px) {
            .calculator {
                padding: 15px;
            }
            button {
                padding: 12px 0;
                font-size: 0.85rem;
            }
            .current-operand {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- Topo com Marca e Assinatura -->
        <div class="header">
            <span class="mode-indicator">Scientific</span>
            <span class="brand-signature">Skelson</span>
        </div>

        <!-- Tela / Display -->
        <div class="display-container">
            <div id="previous-operand" class="previous-operand"></div>
            <div id="current-operand" class="current-operand">0</div>
        </div>

        <!-- Botões -->
        <div class="buttons-grid">
            <!-- Linha 1 -->
            <button class="btn-sci" onclick="appendFunction('sin')">sin</button>
            <button class="btn-sci" onclick="appendFunction('cos')">cos</button>
            <button class="btn-sci" onclick="appendFunction('tan')">tan</button>
            <button class="btn-clear" onclick="clearAll()">AC</button>
            <button class="btn-clear" onclick="deleteChar()">DEL</button>

            <!-- Linha 2 -->
            <button class="btn-sci" onclick="appendFunction('log')">log</button>
            <button class="btn-sci" onclick="appendFunction('ln')">ln</button>
            <button class="btn-sci" onclick="appendValue('(')">(</button>
            <button class="btn-sci" onclick="appendValue(')')">)</button>
            <button class="btn-op" onclick="appendValue('/')">÷</button>

            <!-- Linha 3 -->
            <button class="btn-sci" onclick="appendFunction('sqrt')">√</button>
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="btn-op" onclick="appendValue('*')">×</button>

            <!-- Linha 4 -->
            <button class="btn-sci" onclick="appendValue('**')">x^y</button>
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="btn-op" onclick="appendValue('-')">-</button>

            <!-- Linha 5 -->
            <button class="btn-sci" onclick="appendValue('Math.PI')">π</button>
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="btn-op" onclick="appendValue('+')">+</button>

            <!-- Linha 6 -->
            <button class="btn-sci" onclick="appendValue('Math.E')">e</button>
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="btn-equal" onclick="calculate()">=</button>
        </div>
    </div>

    <!-- Lógica JavaScript -->
    <script>
        const currentDisplay = document.getElementById('current-operand');
        const previousDisplay = document.getElementById('previous-operand');
        let currentInput = '0';
        let shouldResetDisplay = false;

        function updateDisplay() {
            // Torna o código interno amigável para exibição
            let displayText = currentInput
                .replace(/Math\.PI/g, 'π')
                .replace(/Math\.E/g, 'e')
                .replace(/\*\*/g, '^')
                .replace(/\*/g, '×')
                .replace(/\//g, '÷');
            
            currentDisplay.innerText = displayText;
        }

        function appendValue(value) {
            if (currentInput === '0' || shouldResetDisplay) {
                if (value === '.') {
                    currentInput = '0.';
                } else if (['+', '-', '*', '/', '**'].includes(value)) {
                    currentInput += value;
                } else {
                    currentInput = value;
                }
                shouldResetDisplay = false;
            } else {
                currentInput += value;
            }
            updateDisplay();
        }

        function appendFunction(fn) {
            if (currentInput === '0' || shouldResetDisplay) {
                currentInput = fn + '(';
                shouldResetDisplay = false;
            } else {
                currentInput += fn + '(';
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            previousDisplay.innerText = '';
            shouldResetDisplay = false;
            updateDisplay();
        }

        function deleteChar() {
            if (shouldResetDisplay) {
                clearAll();
                return;
            }
            if (currentInput.length === 1 || currentInput === 'Error') {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        function calculate() {
            try {
                let expression = currentInput;
                
                // Mapear funções matemáticas
                expression = expression.replace(/sin\(/g, 'Math.sin(');
                expression = expression.replace(/cos\(/g, 'Math.cos(');
                expression = expression.replace(/tan\(/g, 'Math.tan(');
                expression = expression.replace(/log\(/g, 'Math.log10(');
                expression = expression.replace(/ln\(/g, 'Math.log(');
                expression = expression.replace(/sqrt\(/g, 'Math.sqrt(');

                // Tratar parênteses abertos no final
                const openParenCount = (expression.match(/\(/g) || []).length;
                const closeParenCount = (expression.match(/\)/g) || []).length;
                for (let i = 0; i < openParenCount - closeParenCount; i++) {
                    expression += ')';
                }

                let result = eval(expression);

                // Formatar resultado se for número decimal longo
                if (typeof result === 'number' && !Number.isInteger(result)) {
                    result = parseFloat(result.toFixed(8));
                }

                previousDisplay.innerText = currentDisplay.innerText + ' =';
                currentInput = result.toString();
                shouldResetDisplay = true;
                updateDisplay();
            } catch (error) {
                previousDisplay.innerText = currentDisplay.innerText;
                currentDisplay.innerText = 'Erro';
                currentInput = '0';
                shouldResetDisplay = true;
            }
        }
    </script>
</body>
</html>
